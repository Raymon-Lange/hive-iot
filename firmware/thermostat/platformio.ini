; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
lib_deps =
	olikraus/U8g2@^2.36.18
	knolleary/PubSubClient@^2.8

; PHY mode: reads real temperature from a BMP180 (GY-68 breakout) over I2C,
; sharing the OLED's D5(SCL)/D6(SDA) bus. Build with -e nodemcuv2-phy.
[env:nodemcuv2-phy]
extends = env:nodemcuv2
build_flags = -D FW_MODE_PHY
lib_deps =
	${env:nodemcuv2.lib_deps}
	adafruit/Adafruit BMP085 Library@^1.2.4
